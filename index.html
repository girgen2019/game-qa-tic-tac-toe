<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe · Game QA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>

    <p class="status" data-testid="status" aria-live="polite">Player X's turn</p>

    <div class="board" data-testid="board" role="grid" aria-label="Game board">
      <button class="cell" data-testid="cell-0" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-testid="cell-1" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-testid="cell-2" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-testid="cell-3" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-testid="cell-4" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-testid="cell-5" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-testid="cell-6" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-testid="cell-7" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-testid="cell-8" data-index="8" aria-label="Cell 9"></button>
    </div>

    <div class="score" data-testid="score">
      <span>X: <b data-testid="score-x">0</b></span>
      <span>O: <b data-testid="score-o">0</b></span>
      <span>Draws: <b data-testid="score-draw">0</b></span>
    </div>

    <div class="actions">
      <button class="btn" data-testid="restart">New round</button>
      <button class="btn btn-secondary" data-testid="reset-score">Reset score</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
